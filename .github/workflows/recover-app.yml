name: Recover production app.js
on:
  push:
    paths:
      - .github/workflows/recover-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app.js ]; then
            echo "app.js already exists; refusing to overwrite."
            exit 0
          fi
          curl --fail --location --retry 3 --max-time 90 --silent --show-error \
            'https://skillbridge-naija-ai.vercel.app/app.js' -o app.js
          printf '%s  %s\n' 'f0f59e1010177ce6506e2f7fab951daaf4d6fc05' 'app.js' | sha1sum -c -
          node --check app.js
          test "$(wc -c < app.js)" -gt 60000
      - name: Commit verified original source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- app.js)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js
          git commit -m "chore: restore exact deployed app.js source"
          git push origin HEAD:main
